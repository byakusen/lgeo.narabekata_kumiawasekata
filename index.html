function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    correctAudio.load();
}
document.addEventListener('pointerdown', initAudio, { once: true });

function playSound(type) {
    if (type === 'correct') {
        correctAudio.currentTime = 0;
        correctAudio.play().catch(e => console.error("Audio play error:", e));
        return;
    }

    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === 'wrong') { // ブブー
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.setValueAtTime(130, now + 0.1);
        gainNode.gain.setValueAtTime(0.3, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
    } else if (type === 'click') { // ピッ
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        gainNode.gain.setValueAtTime(0.1, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    }
}

// おわったときに、指示の文のところに出す答え
function answerText() { return bunAnswer(); }

// ===== 分数のタブ =====
// 答え（HTML。分数は分数の形で出す）
function bunAnswer() {
    const L = bunLay;
    if (L.ansHtml) return L.ansHtml;
    const [a, b] = L.ans;
    let h = '答え　' + (b === 1 ? a : fh(a, b)) + (L.unit ? '　' + L.unit : '');
    if (b > 1 && a > b) h += `（${mh(Math.floor(a / b), a % b, b)}）`;
    return h;
}

// テンキーで入れる▢（入れた数字だけを中に出す）
//   2けた以上の▢は、はじめから そのけたの はばを取っておく（入れたときに式がずれない）
function slotHtml(id, extra, attr) {
    const L = bunLay;
    const sl = L.slots[id];
    const idxs = (L.slotStates && L.slotStates[id]) || [];
    const fin = states[state] && states[state].type === 'finish';
    const shown = fin ? idxs.length : idxs.filter(i => i < state).length;
    const active = !fin && idxs.includes(state);
    const cls = active ? 'active' : (shown >= idxs.length && idxs.length ? 'filled' : '');
    const len = sl.val.length;
    const wide = (len >= 2) ? ` style="min-width: calc(${len}ch + 18px);"` : '';
    return `<span class="fr-slot ${cls}${extra ? ' ' + extra : ''}"${attr || ` id="slot-${id}"`}${wide}>${sl.val.slice(0, shown)}</span>`;
}
const bunVal = v => (v && typeof v === 'object' && v.slot) ? slotHtml(v.slot) : v;

// 式の部品1つを HTML に
function bunTok(t) {
    const mk = t.mk ? ` data-mk="${t.mk}"` : '';   // ヒントで下に「小」「大」を出す分数
    if (t.t === 'fr') return `<span class="fr"${mk}><span class="fn">${bunVal(t.n)}</span><span class="fd">${bunVal(t.d)}</span></span>`;
    if (t.t === 'mx') return `<span class="mx"${mk}><span>${bunVal(t.w)}</span>${bunTok(tF(t.n, t.d))}</span>`;
    if (t.t === 'op') return `<span class="op">${t.v}</span>`;
    if (t.t === 'ring') return `<span class="bun-ring${bunLay.ringOn ? ' on' : ''}"${t.dk ? ` data-dk="${t.dk}"` : ''}>${t.toks.map(bunTok).join('')}</span>`;   // ringOn：ヒントで出した赤い丸を、逆数をかける▢を入れおわるまで のこす
    if (t.t === 'num') {   // uhOn：ヒントで出した 線と1・10・100 を、次の段の▢を入れおわるまで のこす
        const keep = t.uh && bunLay.uhOn === t.uh.k;
        return `<span class="nm"${t.uh ? ` data-uhk="${t.uh.k}" data-uhv="${t.uh.v}"` : ''}${keep ? ' style="position: relative;"' : ''}>${bunVal(t.v)}${keep ? `<span class="fr-uh">${t.uh.v}</span>` : ''}</span>`;
    }
    if (t.t === 'ykf') {   // 約分する式の分数
        const yk = t.yk, x = '<span class="yk-x">×</span>';
        return `<span class="fr"><span class="fn">${yk.nIds.map((id, i) => ykPartHTML(yk, 'n', i)).join(x)}</span>` +
               `<span class="fd">${yk.dIds.map((id, i) => ykPartHTML(yk, 'd', i)).join(x)}</span></span>`;
    }
    if (t.t === 'ykg') {   // 何で約分したか（○の数）。はばを先に取っておく。何でえらぶときは、からの◯を出す
        const yk = t.yk, s = states[state];
        if (!yk.need) return '';
        const choosing = s && s.type === 'yakubun' && s.yk === yk && yk.phase === 'choose';
        return `<span class="yk-gs" style="min-width:${yk.need * (bunLay.compact ? 28 : 36)}px">${(yk.gs || []).map(g => `<span class="yk-g">${g}</span>`).join('')}` +
               `${choosing ? '<span class="yk-g active"></span>' : ''}</span>`;
    }
    if (t.t === 'tx') return `<span class="${t.cls}">${t.v}</span>`;
    if (t.t === 'tree') return treeHtml(t);   // 樹形図
    if (t.t === 'vs') return vsHtml(t);       // 対戦表
    if (t.t === 'poly') return polyHtml(t);   // 組み合わせの図
    if (t.t === 'cs') {
        const L = bunLay, c = L.steps[t.step].choice;
        const fin = states[state] && states[state].type === 'finish';
        const passed = fin || state > L.stepStart[t.step];
        const act = !passed && state === L.stepStart[t.step];
        return `<span class="ten-boxes ans-frame cs-frame${passed ? ' filled' : act ? ' active' : ''}">${passed ? (c.show || c.opts)[c.expect] : ''}</span>`;   // show：▢に出す字（ボタンの字と ちがうとき）
    }
    return '';
}

// ----- 約分（分数×分数2 と同じ手順：何で → 分母をクリック → 下に入れる → 分子をクリック → 上に入れる）-----
const ykCur = e => e.vals[e.vals.length - 1];   // いまの数（約分したあとの数）
function ykCan(yk) {                             // まだ約分できるか
    return yk.nums.some(n => yk.dens.some(d => gcd(ykCur(n), ykCur(d)) > 1));
}
function ykMsg(yk) {
    if (yk.phase === 'choose') return yk.first ? '約分しよう。何で約分するか、えらぼう。' : 'まだ約分できるよ。何で約分するか、えらぼう。';
    if (yk.phase === 'den')    return `分母の、${yk.g}でわれる数をクリックしよう。`;
    if (yk.phase === 'denIn')  return `${yk.g}でわった数を、下に入れよう。`;
    if (yk.phase === 'num')    return `分子の、${yk.g}でわれる数をクリックしよう。`;
    return `${yk.g}でわった数を、上に入れよう。`;
}
// 約分する式の分子・分母の1つの数（▢に斜線、約分した数を 分子は上・分母は下 に書く）
function ykPartHTML(yk, side, i) {
    const s = states[state];
    const list = side === 'n' ? yk.nums : yk.dens;
    const id = (side === 'n' ? yk.nIds : yk.dIds)[i];
    if (!list) return slotHtml(id);
    const e = list[i];
    const now = s && s.type === 'yakubun' && s.yk === yk;
    const pending = now && yk.t === i && yk.phase === (side === 'n' ? 'numIn' : 'denIn');   // クリックした数（先に斜線）
    const marks = e.vals.slice(1).map((v, k, arr) => `<span class="yk-v${(k < arr.length - 1 || (pending && k === arr.length - 1)) ? ' yk-strike' : ''}">${v}</span>`).join('') +
                  (pending ? `<span class="yk-in">${yk.typed}</span>` : '');
    const click = now && yk.phase === (side === 'n' ? 'num' : 'den');
    const extra = ((e.vals.length > 1 || pending) ? 'yk-strike' : '') + (click ? ' yk-click' : '');
    const attr = (yk.yi !== undefined) ? ` id="yk-${side}${i}" data-yk="${side}${i}"` : '';
    return `<span class="yk-col">${side === 'n' ? `<span class="yk-up">${marks}</span>` : ''}` +
           slotHtml(id, extra, attr) +
           `${side === 'd' ? `<span class="yk-dn">${marks}</span>` : ''}</span>`;
}
// 何で約分するか（ボタン）
function ykChoose(b) {
    const yk = states[state].yk;
    if (yk.phase !== 'choose') return;
    const g = Number(b.dataset.v);
    if (yk.nums.some(n => ykCur(n) % g === 0) && yk.dens.some(d => ykCur(d) % g === 0)) {
        playSound('click');
        yk.g = g; yk.gs.push(g); yk.phase = 'den';
        updateUI();
    } else {
        handleWrong(b.id);
    }
}
// 約分する数をクリック（分母 → 分子）
function ykClick(el) {
    const yk = states[state].yk;
    const side = el.dataset.yk[0], i = Number(el.dataset.yk.slice(1));
    if (yk.phase !== 'den' && yk.phase !== 'num') return;
    let ok = false;
    if (yk.phase === 'den' && side === 'd') ok = ykCur(yk.dens[i]) % yk.g === 0 && yk.nums.some(n => ykCur(n) % yk.g === 0);
    if (yk.phase === 'num' && side === 'n') ok = ykCur(yk.nums[i]) % yk.g === 0;
    if (ok) {
        playSound('click');
        yk.t = i; yk.typed = '';
        yk.phase = (side === 'd') ? 'denIn' : 'numIn';
        updateUI();
    } else {
        handleWrong(el.id);
    }
}
// 約分した数をテンキーで入れる
function ykKey(val) {
    const yk = states[state].yk;
    if (yk.phase !== 'denIn' && yk.phase !== 'numIn') return;
    const e = (yk.phase === 'denIn' ? yk.dens : yk.nums)[yk.t];
    const want = String(ykCur(e) / yk.g);
    if (String(val) === want[yk.typed.length]) {
        playSound('click');
        yk.typed += String(val);
        if (yk.typed.length === want.length) {
            e.vals.push(Number(want));
            yk.typed = ''; yk.t = -1;
            if (yk.phase === 'denIn') yk.phase = 'num';
            else if (ykCan(yk)) { yk.phase = 'choose'; yk.first = false; }
            else state++;
        }
        updateUI();
    } else {
        handleWrong('numpad');
    }
}

// そのステートで画面を書く（問題文・出てきた式の行・えらぶボタン）
function drawBun(s) {
    const L = bunLay;
    if (!L) return;
    const fin = s.type === 'finish';
    if (!s.ring) L.ringOn = false;   // 逆数をかける▢を入れおわったら、赤い丸は消す
    if (!s.uh && !s.ring) L.uhOn = '';   // 線と1・10・100 は、次の段（逆数をかける▢）を入れおわったら消す
    document.getElementById('bun-panel').classList.toggle('uh-on', !!L.uhOn);
    // ヒントで出した図（hc）は、同じ hc の手順の あいだは のこす
    if (L.hcOn && s.hc !== L.hcOn) L.hcOn = '';
    const pnl = document.getElementById('bun-panel');
    if (L.hcOn) pnl.dataset.hc = L.hcOn; else delete pnl.dataset.hc;
    pnl.classList.toggle('bun-sm', !!L.sm);
    pnl.classList.toggle('side', !!L.side);
    pnl.classList.toggle('ztop', !!L.ztop);         // 図をかこう：問題文・ボタンを 左上に
    pnl.classList.toggle('zr', L.ztop === 'r');     // 図をかこう（4人）：図は 右に
    pnl.classList.toggle('ptop', !!L.ptop);         // お金の金額：問題文と 硬貨を 上に よせる
    document.getElementById('bun-q').innerHTML = L.q || '';
    document.getElementById('bun-panel').classList.toggle('bun-compact', !!L.compact);
    document.getElementById('bun-panel').classList.toggle('bun-tall', L.lines.length >= 3 || !!L.tall);   // 式が3行：下のすき間を広く（ヒントの赤い字が 枠から出ないように）
    document.getElementById('bun-lines').innerHTML = L.lines
        .filter(ln => fin || state >= L.stepStart[ln.from])
        .map(ln => {
            const isNew = !fin && ln.from > 0 && L.stepStart[ln.from] === state;
            const ykRow = ln.toks.some(t => t.t === 'ykf');   // 約分の行（分母の下に 約分の数を書く場所が 空けてある）
            return `<div class="bline${isNew ? ' fade-in' : ''}${ykRow ? ' yk-row' : ''}">${ln.toks.map(bunTok).join('')}</div>`;
        }).join('');
    if (L.cp) cpMark(s);   // お金の金額：いま 硬貨を えらぶ 場所に 印
    vsArrow();             // 対戦表：ヒントの やじるし

    // ヒントの文を出す場所（えらぶ問題だけ。はじめから場所を取っておく）
    const hb = document.getElementById('bun-hint');
    hb.innerHTML = '';
    hb.style.display = L.steps.some(st => (st.choice && st.choice.hint) || (st.slot && L.slots[st.slot].htop)) ? '' : 'none';
    hb.classList.toggle('tall', !!L.hintTall);
    hb.classList.toggle('unit', !!L.hintUnit);

    // 約分：何で約分するか（2〜9 のボタン。テンキーの場所に出す）・指示の文・テンキー
    const pad = document.getElementById('choice-pad');
    const ykChoosing = s.type === 'yakubun' && s.yk.phase === 'choose';
    pad.innerHTML = ykChoosing ? [2, 3, 4, 5, 6, 7, 8, 9, 10].map(g => `<button class="yk-btn" id="choice-${g}" data-v="${g}">${g}</button>`).join('') : '';   // 10 は 2列ぶんの はば
    pad.classList.toggle('visible', ykChoosing);
    if (s.type === 'yakubun') {
        document.getElementById('instruction').innerText = s.text = ykMsg(s.yk);
        document.getElementById('numpad').classList.toggle('visible', s.yk.phase === 'denIn' || s.yk.phase === 'numIn');
    }

    // えらぶボタン：えらぶ手順のときと、おわったときの keep（答えに印をつけてのこす）
    const box = document.getElementById('bun-choices');
    let k = -1, done = false;
    if (s.type === 'choice' || s.type === 'choices') k = s.step;
    else if (fin && L.keep >= 0) { k = L.keep; done = true; }
    if (k < 0) { box.style.display = 'none'; box.innerHTML = ''; return; }
    const c = L.steps[k].choice;
    if (c.tap) { box.style.display = 'none'; box.innerHTML = ''; return; }   // ○をかこう：表の マスを タップする
    const ok = Array.isArray(c.expect) ? c.expect : [c.expect];
    box.className = ((c.cols === 3) ? 'three' : (c.cols === 1) ? 'one' : '') + (c.dkGap ? ' dk-gap' : '');   // one：1列（文の ボタン）   // dk-gap：ボタンの下に「大→小」を書く場所を取っておく
    if (c.cols > 3) { box.classList.add('many'); box.style.gridTemplateColumns = `repeat(${c.cols}, 1fr)`; } else box.style.gridTemplateColumns = '';
    box.style.display = 'grid';
    box.innerHTML = c.opts.map((o, i) =>
        `<button class="choice-btn${c.sym ? ' sym' : ''}${c.txt ? ' txt' : ''}${done && ok.includes(i) ? ' picked' : ''}" id="ch-${i}" data-i="${i}">` +
        (c.sym ? '' : `<span class="lab">${'アイウエオカキク'[i]}</span>`) +
        `<span class="cx">${typeof o === 'string' ? o : o.map(bunTok).join('')}</span></button>`
    ).join('');
}

// えらぶ手順で 正解したとき：ボタンを みどりに して「せいかい！」を出し、少し 間を おいてから 次の手順へ
const CHOICE_OK_MS = 900;
let growNow = null;      // 図をかこう：えらびおわった 点（{ lay, st }）。次の 手順を 待つ あいだも 枝を 出しておく
let choiceWait = null;   // { lay, st }：正解を 見せている 問題と 手順
function choiceOk(btns) {
    btns.forEach(x => { if (x) x.classList.add('ok'); });
    let pop = document.getElementById('ok-pop');
    if (!pop) { pop = document.createElement('div'); pop.id = 'ok-pop'; pop.textContent = 'せいかい！'; document.body.appendChild(pop); }
    pop.classList.add('show');
    const lay = bunLay, cur = state;
    choiceWait = { lay: lay, st: cur };
    setTimeout(() => {
        pop.classList.remove('show');
        choiceWait = null;
        if (bunLay !== lay || state !== cur) return;   // 次へ・タブで 問題が かわっていたら 何もしない
        state++;
        updateUI();
    }, CHOICE_OK_MS);
}

// えらんだ 記号を、すぐ ▢に 入れる（fill の 手順だけ。そのあと 少し 間を おいて 次へ）
function csFill(s, i) {
    const c = bunLay.steps[s.step].choice;
    if (!c.fill) return;
    const f = document.querySelector('#bun-lines .cs-frame.active');
    if (!f) return;
    f.classList.remove('active');
    f.classList.add('filled');
    f.innerHTML = (c.show || c.opts)[i];
}
// えらぶボタンをおしたとき
document.getElementById('bun-choices').addEventListener('click', e => {
    const b = e.target.closest('.choice-btn');
    if (!b) return;
    const s = states[state];
    const i = Number(b.dataset.i);
    if (choiceWait && choiceWait.lay === bunLay && choiceWait.st === state) return;   // 正解を 見せている あいだは おせない
    if (s.type === 'choice') {
        if (i !== s.expect) bunTrySwapChoice(s, i);   // 上下 どちらでも よい▢（pair）は、えらんだ ものに 合わせて 入れかえる
        if (i === s.expect) { playSound('click'); csFill(s, i); choiceOk([b]); }
        else handleWrong(b.id);
    } else if (s.type === 'choices') {
        if (!s.expect.includes(i)) { handleWrong(b.id); return; }
        if (!selectedCells.includes('ch' + i)) {
            selectedCells.push('ch' + i);
            b.classList.add('picked');
            playSound('click');
        }
        if (s.expect.every(k => selectedCells.includes('ch' + k))) {
            if (bunLay.steps[s.step].choice.grow) { growNow = { lay: bunLay, st: state }; drawBun(s); anchorFix(); }   // 図をかこう：枝は すぐ 出して、次の 手順へは 少し 間を おく
            choiceOk(s.expect.map(k => document.getElementById('ch-' + k)));
        }
    }
});

// =====================================================================
// 画面を、いまの手順（states[state]）に合わせる
// =====================================================================
function updateUI() {
    const s = states[state];
    document.getElementById('instruction').innerText = s.text;
    selectedCells = [];

    // テンキーは、数を入れる手順のときだけ出す（約分の テンキーは drawBun の中）
    document.getElementById('numpad').classList.toggle('visible', s.type === 'input');
    // テンキーの「.」と、×÷＋− のキー
    const dotBtn = document.querySelector('.num-btn.dot-btn');
    if (dotBtn) dotBtn.style.visibility = DOT_MODES.includes(mode) ? '' : 'hidden';
    document.getElementById('op-pad').classList.toggle('visible', OP_PAD_MODES.includes(mode) && s.type === 'input');

    drawBun(s);
    anchorFix();   // 図の 高さを かえない
    if (s.type === 'finish') {
        document.getElementById('instruction').innerHTML = answerText();
        if (!document.getElementById('hanamaru').classList.contains('show')) {
            showClearEffect();
        }
    }
}

// --- まちがえたとき：ブブー・「ちがうよ！」・ゆれる・連続正解を0に ---
function handleWrong(elementId) {
    playSound('wrong');
    const popup = document.getElementById('popup');
    popup.classList.add('show');
    setTimeout(() => popup.classList.remove('show'), 1000);

    if (chal.on) { chal.miss++; chal.missNow++; }   // 10問チャレンジの記録
    comboCount = 0;
    document.getElementById('combo-count').innerText = comboCount;
    const s = states[state];
    if (s) {
        const k = s.kind || 'other';                 // 手順の kind ごとに まちがいを数える（アドバイスに使う）
        errorStats[k] = (errorStats[k] || 0) + 1;
    }

    if (elementId) {
        const el = document.getElementById(elementId);
        if (el) {
            el.classList.remove('shake');
            void el.offsetWidth; // reflow
            el.classList.add('shake');
        }
    }
}

// ===== 10問チャレンジ =====
// どのタブでも使える。10問おわると、ノーミスの数・まちがえた回数・かかった時間を出す。
let chal = { on: false, total: 10, no: 0, miss: 0, missNow: 0, perfect: 0, t0: 0 };

function chalUpdateBar() {
    document.getElementById('btn-challenge').classList.toggle('on', chal.on);
    document.getElementById('chal-bar').style.display = chal.on ? 'flex' : 'none';
    if (!chal.on) return;
    let dots = '';
    for (let i = 0; i < chal.total; i++) dots += (i < chal.no) ? '●' : '○';
    document.getElementById('chal-dots').innerText = dots;
    document.getElementById('chal-count').innerText = `${Math.min(chal.no + 1, chal.total)}問め / ${chal.total}`;
}

function chalReset() {          // はじめから数えなおす
    chal.no = 0; chal.miss = 0; chal.missNow = 0; chal.perfect = 0; chal.t0 = Date.now();
    document.getElementById('chal-result').classList.remove('show');
    chalUpdateBar();
}

function chalDone() {           // 1問おわったときに呼ぶ
    if (!chal.on) return;
    if (chal.missNow === 0) chal.perfect++;
    chal.no++;
    chalUpdateBar();
    if (chal.no < chal.total) {
        setTimeout(() => { if (chal.on) initGame(); }, 1800);   // つぎの問題へ
        return;
    }
    const sec = Math.floor((Date.now() - chal.t0) / 1000);
    const msg = (chal.perfect === chal.total) ? 'ぜんぶノーミス！ すばらしい！'
              : (chal.perfect >= chal.total - 2) ? 'よくがんばりました！'
              : 'つぎは もっとできる！';
    setTimeout(() => {
        document.getElementById('chal-lines').innerHTML =
            `<div>ノーミスでできた問題　<b>${chal.perfect}</b> / ${chal.total}</div>` +
            `<div>まちがえた回数　<b>${chal.miss}</b> 回</div>` +
            `<div>かかった時間　<b>${Math.floor(sec / 60)}</b> 分 <b>${sec % 60}</b> 秒</div>` +
            `<div class="chal-msg">${msg}</div>`;
        document.getElementById('chal-result').classList.add('show');
    }, 1500);
}

document.getElementById('btn-challenge').addEventListener('click', () => {
    chal.on = !chal.on;
    playSound('click');
    chalReset();
    initGame();
});
document.getElementById('btn-chal-again').addEventListener('click', () => { chalReset(); initGame(); });
document.getElementById('btn-chal-quit').addEventListener('click', () => { chal.on = false; chalReset(); initGame(); });

// --- 正解して1問おわったとき：はなまる・ピンポン・紙吹雪・時間とアドバイス・連続正解 ---
function showClearEffect() {
    document.getElementById('hanamaru').classList.add('show');
    playSound('correct');

    if (typeof confetti !== 'undefined') {
        confetti({
            particleCount: 150,
            spread: 80,
            origin: { y: 0.6 },
            colors: ['#ffeb3b', '#ff9800', '#4caf50', '#00bcd4', '#e91e63']
        });
    }

    // タイム測定、アドバイス、コンボ
    const timeTaken = Math.floor((Date.now() - startTime) / 1000);
    let advice = "";
    let maxError = 0;
    let worstType = "";
    for (const [key, val] of Object.entries(errorStats)) {
        if (val > maxError) {
            maxError = val;
            worstType = key;
        }
    }

    if (maxError > 0) {
        advice = BUN_ADVICE[worstType] || "つぎはノーミスをめざそう！";
    } else {
        advice = "かんぺき！すばらしい！";
    }

    comboCount++;
    document.getElementById('combo-count').innerText = comboCount;
    const comboSpan = document.getElementById('combo-count');
    comboSpan.style.transform = 'scale(1.5)';
    setTimeout(() => comboSpan.style.transform = 'scale(1)', 300);

    setTimeout(() => {
        document.getElementById('instruction').innerHTML = `${answerText()}<br><span style="font-size: 1rem; color: #d32f2f;">🕒 ${timeTaken}秒！ ${advice}</span>`;
    }, 500);

    chalDone();   // 10問チャレンジ中なら、1問すすめる
}

// テンキー
document.querySelectorAll('.num-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const s = states[state];
        if (s.type === 'yakubun') { ykKey(btn.dataset.val); return; }   // 約分
        if (s.type === 'input') {
            const raw = btn.dataset.val;
            // 数字は数として、小数点や ×÷＋− は文字のまま持つ
            const val = /^[0-9]$/.test(raw) ? parseInt(raw, 10) : raw;
            if (val !== s.expect()) bunTrySwap(s, val) || bunTryGroup(s, val);   // 上下 どちらでも よい▢（pair）は、入れた数に 合わせて 入れかえる。grp の ▢は どの 順でも よい
            if (val === s.expect()) {
                playSound('click');
                state++;
                updateUI();
            } else {

            }
        }
    });
});

// 上下 どちらでも よい えらぶ▢（choice の pair）：もう一方の▢の 答えを えらんだら、2つの▢の 答えを 入れかえる
function bunTrySwapChoice(s, i) {
    const L = bunLay;
    const c = L.steps[s.step] && L.steps[s.step].choice;
    if (!c || c.pair === undefined) return false;
    const o = L.steps[c.pair].choice;
    if (o.expect !== i || L.stepStart[c.pair] < state) return false;   // もう一方が えらびおわっていたら 入れかえない
    [c.expect, o.expect] = [o.expect, c.expect];
    states.forEach(st => { if (st.step === s.step) st.expect = c.expect; else if (st.step === c.pair) st.expect = o.expect; });
    return true;
}

// 上下 どちらでも よい▢（slot の pair）：もう一方の▢の 数を 入れたら、2つの▢の 答えを 入れかえる（1けたの▢だけ）
function bunTrySwap(s, val) {
    const L = bunLay;
    if (!L || !s.targetCell) return false;
    const id = s.targetCell.replace(/_\d+$/, '');
    const sl = L.slots[id];
    if (!sl || !sl.pair || !L.slots[sl.pair]) return false;
    const ot = L.slots[sl.pair];
    if (sl.val.length !== 1 || ot.val.length !== 1 || String(val) !== ot.val) return false;
    if (L.slotStates[sl.pair].some(i => i < state)) return false;   // もう一方が 入れおわっていたら 入れかえない
    [sl.val, ot.val] = [ot.val, sl.val];
    const ks = [id, sl.pair];
    if (sl.sub && ot.sub && L.slots[sl.sub] && L.slots[ot.sub]) {   // その先の▢（3けたの 一の位）も いっしょに 入れかえる
        [L.slots[sl.sub].val, L.slots[ot.sub].val] = [L.slots[ot.sub].val, L.slots[sl.sub].val];
        ks.push(sl.sub, ot.sub);
    }
    ks.forEach(k => L.slotStates[k].forEach(i => { const c = L.slots[k].val; states[i].expect = () => Number(c); }));
    return true;
}

// どの 順番で 書いても よい ▢の 組（slot の grp）：まだ 入れて いない ▢の 中に、入れた 数で 始まる 答えが あれば、答えを 入れかえる
function bunTryGroup(s, val) {
    const L = bunLay;
    if (!L || !s.targetCell) return false;
    const m = s.targetCell.match(/^(.*)_(\d+)$/);
    if (!m) return false;
    const id = m[1], i = Number(m[2]), sl = L.slots[id];
    if (!sl || !sl.grp) return false;
    const want = sl.val.slice(0, i) + String(val);   // この ▢に ここまで 入れた 数 ＋ いま 入れた 数
    const k = Object.keys(L.slots).find(x => x !== id && L.slots[x].grp === sl.grp && L.slotStates[x][0] > state
        && L.slots[x].val.length === sl.val.length && L.slots[x].val.startsWith(want));
    if (!k) return false;
    [sl.val, L.slots[k].val] = [L.slots[k].val, sl.val];
    [id, k].forEach(x => L.slotStates[x].forEach((si, j) => { const c = L.slots[x].val[j]; states[si].expect = () => Number(c); }));
    return true;
}

// キーボードからの入力（テンキーが出ているときだけ。テンキーのボタンを押したのと同じ）
let ykTenWait = false;   // 約分の 10：「1」を うったあと「0」を 待っている
//   0〜9（キーボードのテンキーもOK）／約分の「何で約分するか」の場面では 2〜9
document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    let btn = null;
    if (/^[0-9]$/.test(e.key) && document.getElementById('numpad').classList.contains('visible')) {
        btn = document.querySelector(`#numpad .num-btn[data-val="${e.key}"]`);
    } else if (/^[0-9]$/.test(e.key) && states[state] && states[state].type === 'yakubun' && document.getElementById('choice-pad').classList.contains('visible')) {
        // 10 は「1」→「0」と うつ（「1」を うつと、10 の ボタンが うすく 光って 待つ）
        const ten = document.getElementById('choice-10');
        if (e.key === '1') { ykTenWait = true; if (ten) ten.classList.add('picked'); e.preventDefault(); return; }
        if (ykTenWait && e.key === '0') btn = ten;
        else if (/^[2-9]$/.test(e.key)) btn = document.querySelector(`#choice-pad .yk-btn[data-v="${e.key}"]`);
        ykTenWait = false;
        if (ten) ten.classList.remove('picked');
    }
    if (!btn) return;
    e.preventDefault();
    if (!audioCtx) initAudio();   // キーボードだけで使うときも、ブブーの音が鳴るように
    btn.style.transform = 'translateY(2px)';
    setTimeout(() => { btn.style.transform = ''; }, 100);
    btn.click();
});

// 約分：何で約分するか（2〜9 のボタン）
document.getElementById('choice-pad').addEventListener('click', e => {
    const b = e.target.closest('.yk-btn');
    const s = states[state];
    if (b && s && s.type === 'yakubun') ykChoose(b);
});
// ○をかこう：表の マスを タップしたとき（右上か 左下の どちらか 一方に そろえて かけば 正解）
document.getElementById('bun-lines').addEventListener('click', e => {
    const td = e.target.closest('[data-tap]');
    const s = states[state];
    if (!td || !s || s.type !== 'choices') return;
    const c = bunLay.steps[s.step].choice;
    if (!c.tap) return;
    if (choiceWait && choiceWait.lay === bunLay && choiceWait.st === state) return;
    const i = Number(td.dataset.tap);
    if (!s.expect.includes(i) && !selectedCells.length && c.alt && c.alt.includes(i)) {   // 1つめを 左下に かいたら、左下に そろえる
        [c.expect, c.alt] = [c.alt, c.expect];
        s.expect = c.expect;
    }
    if (!s.expect.includes(i)) { handleWrong(td.id); return; }
    if (!selectedCells.includes('tp' + i)) {
        selectedCells.push('tp' + i);
        td.classList.add('tapped');
        playSound('click');
    }
    if (s.expect.every(k => selectedCells.includes('tp' + k))) choiceOk(s.expect.map(k => document.getElementById('tp-' + k)));
});
// ===== お金の金額：上の 硬貨から 2枚 えらぶ =====
//   えらぶ 組の 順番は 自由。まだ えらんで いない 組なら 正解。えらんだ 組を いまの 場所に 入れかえて、手順を 作りなおす
function cpMark(s) {
    const cp = bunLay.cp, st = s && bunLay.steps[s.step];
    const on = !!(s && s.type === 'choices' && st && st.choice && st.choice.coin !== undefined);
    document.getElementById('bun-panel').classList.toggle('coin-tap', on);
    if (!on) return;
    cp.picks = [];
    document.querySelectorAll(`#bun-lines .cp-${st.choice.coin} .cp-ph`).forEach(e => e.classList.add('active'));
}
document.getElementById('bun-lines').addEventListener('click', e => {
    const el = e.target.closest('[data-coin]');
    const s = states[state], L = bunLay;
    if (!el || !s || s.type !== 'choices' || !L || !L.cp) return;
    const c = L.steps[s.step].choice;
    if (c.coin === undefined) return;
    if (choiceWait && choiceWait.lay === L && choiceWait.st === state) return;
    const cp = L.cp, p = c.coin, i = Number(el.dataset.coin);
    if (cp.picks.includes(i)) return;   // 同じ 硬貨を もう一度 おしたときは 何もしない
    const rest = cp.pr.filter((x, q) => q >= p);   // まだ えらんで いない 組
    const ok = cp.picks.length ? rest.some(x => x.includes(i) && x.includes(cp.picks[0])) : rest.some(x => x.includes(i));
    if (!ok) { handleWrong(el.id); return; }
    cp.picks.push(i);
    el.classList.add('picked');
    playSound('click');
    const ph = document.querySelector(`#bun-lines .cp-${p} .cp-ph`);   // のこっている 点線の 丸の 1つめに 入れる
    if (ph) ph.outerHTML = cp.coin(cp.C[i]);
    if (cp.picks.length < 2) return;
    // 組が きまった：えらんだ 組を いまの 場所(p) に、もとの 組を その組が あった 場所(q) に
    const pk = cp.picks.slice().sort((a, b) => a - b);
    const q = cp.pr.findIndex((x, k) => k >= p && x[0] === pk[0] && x[1] === pk[1]);
    if (q !== p) [cp.pr[p], cp.pr[q]] = [cp.pr[q], cp.pr[p]];
    cp.toks[p].v = cp.coin(cp.C[cp.picks[0]]) + cp.coin(cp.C[cp.picks[1]]);   // えらんだ 順に 並べて のこす
    // ▢円の 答え・ことば、のこりの えらぶ 手順の ヒントを 合わせて、手順を 作りなおす（いまより 前の 手順は かわらない）
    cp.pr.forEach((x, k) => {
        if (k < p) return;
        const sl = L.slots[cp.slots[k]], v = cp.C[x[0]] + cp.C[x[1]];
        sl.val = String(v);
        sl.msg = `${cp.C[x[0]]}円と ${cp.C[x[1]]}円で いくらかな。`;
        sl.htop = cp.slotHint(x[0], x[1]);
        const ch = L.steps[cp.steps[k]].choice;
        ch.expect = x.slice();
        if (k > p) ch.hint = cp.hintFor(cp.pr.slice(k).map(y => y.slice()).sort((a, b) => a[0] - b[0] || a[1] - b[1]));
    });
    generateStates();
    choiceOk(cp.picks.map(k => document.getElementById('cn-' + k)));
});
// 約分する数のクリック

// 分数のタブのヒント（分数×分数2 と同じ考え方：答えは光らせない。考え方の式や印を出す）
//   どれも 次の手順で 画面を書きなおすと 消える。式の位置は動かさない
function bunHint(s) {
    // ヒントで出す図（樹形図・線・表の○ など）：hc
    if (s.hc) { bunLay.hcOn = s.hc; document.getElementById('bun-panel').dataset.hc = s.hc; }
    if (s.type === 'input') {
        // 上の ヒントの文（htop）
        if (s.htop) document.getElementById('bun-hint').innerHTML = s.htop;
        // ヒントの式（逆数のかけ方・帯分数を仮分数になおす式 など）を、いまの▢がある行のすぐ下に出す
        const act = document.querySelector('#bun-lines .fr-slot.active');
        const row = act && act.closest('.bline');
        if (s.hint && row && !row.querySelector('.fr-hint')) {
            row.style.position = 'relative';
            row.insertAdjacentHTML('beforeend', `<div class="fr-hint">${s.hint}</div>`);
        }
        // わる数の逆数をかけるところ：「÷ わる数」を赤い丸で囲む
        if (s.ring) { bunLay.ringOn = true; document.querySelectorAll('#bun-lines .bun-ring').forEach(e => e.classList.add('on')); }
        // 小数の下に 赤い横線と 分母（10・100）を書いて、分数の形を見せる
        if (s.uh) { bunLay.uhOn = s.uh; document.getElementById('bun-panel').classList.add('uh-on'); }
        if (s.uh) document.querySelectorAll(`#bun-lines [data-uhk="${s.uh}"]`).forEach(e => {
            if (e.querySelector('.fr-uh')) return;
            e.style.position = 'relative';
            e.insertAdjacentHTML('beforeend', `<span class="fr-uh">${e.dataset.uhv}</span>`);
        });
    } else if (s.type === 'choice' || s.type === 'choices') {
        // わる数の下に「小」（1より小さい）・「大」（1より大きい）
        document.querySelectorAll('#bun-lines [data-mk]').forEach(mk => {
            if (mk.querySelector('.fr-mk')) return;
            mk.style.position = 'relative';
            mk.insertAdjacentHTML('beforeend', `<span class="fr-mk">${mk.dataset.mk}</span>`);
        });
        // えらぶボタンの「÷ わる数」を赤い丸で囲み、下に「大」に斜線 →「小」（または「小」→「大」）
        document.querySelectorAll('#bun-choices [data-dk]').forEach(r => {
            r.classList.add('on');
            if (r.querySelector('.fr-dk')) return;
            r.style.position = 'relative';
            const a = r.dataset.dk, b = (a === '大') ? '小' : '大';
            r.insertAdjacentHTML('beforeend', `<span class="fr-dk"><span class="dk-x">${a}</span><span>${b}</span></span>`);
        });
        // きまり・公式の文
        if (s.hint) document.getElementById('bun-hint').innerHTML = s.hint;
        // 文章題（何倍・比べる量・もとにする量）：問題文の ことばの下に 数・＝・×・□
        document.querySelectorAll('#bun-q .qrow').forEach(r => r.classList.add('on'));
        // まちがいさがし：まちがっている ところを 赤い丸で 囲む
        document.querySelectorAll('#bun-lines .bun-ring').forEach(r => r.classList.add('on'));
        // 文章題：数直線（指示の文の上に 重ねて出す）
        if (bunLay.nl && !document.getElementById('nl-card')) document.getElementById('instruction').insertAdjacentHTML('beforeend', nlHtml(bunLay.nl));
    }
    // 約分（yakubun）：ヒントで光らせるものはない
}

// ヒントを もう一度 おしたとき：出ている ヒントを 全部 消す

// ===== 手順が すすんでも、図（1行め）の 高さを かえない =====
//   ボタンが 消えたり、下の 行が 出たり しても 動かないように、はじめに 全部の 手順を 書いて はかっておく
//   ・ふつう・side：上に そろえ、いちばん 高い 手順が まん中に なるように 上の すき間を とる
//   ・ztop（図をかこう）・ptop（お金の金額）は もとから 上に そろえて いるので、そのまま
//   ・図が 下に ある 形（ztop）は、図の 上に すき間を 足して いちばん 下の 位置に そろえる（anchorFix）
const anchorEl = () => (bunLay && bunLay.lines.length && bunLay.lines[0].from === 0) ? document.querySelector('#bun-lines > .bline') : null;
function bunAnchor() {
    const L = bunLay, pnl = document.getElementById('bun-panel');
    L.anchorTop = undefined;
    pnl.style.paddingTop = '';
    pnl.style.minHeight = '';
    const center = !L.ztop && !L.ptop;
    pnl.classList.toggle('anch', center);
    if (center) pnl.style.minHeight = '0px';
    let H = 0, T = -1;
    for (let i = 0; i < states.length; i++) { state = i; drawBun(states[i]); H = Math.max(H, pnl.offsetHeight); }
    if (center) {
        pnl.style.minHeight = '';
        const cs = getComputedStyle(pnl);
        const extra = Math.max(0, ((parseFloat(cs.minHeight) || 0) - H) / 2);
        pnl.style.paddingTop = (parseFloat(cs.paddingTop) + extra) + 'px';
    }
    for (let i = 0; i < states.length; i++) { state = i; drawBun(states[i]); const el = anchorEl(); if (el) T = Math.max(T, el.offsetTop); }
    if (T >= 0) L.anchorTop = T;
    state = 0;
}
function anchorFix() {
    const L = bunLay, el = anchorEl();
    if (!L || L.anchorTop === undefined || !el) return;
    const d = L.anchorTop - el.offsetTop;
    if (d > 0) el.style.marginTop = d + 'px';
}

// 画面の 高さ（はば）に 入りきらないときは、アプリ全体を ちぢめて 1画面に 収める（スマホは たてにスクロール）
function fitScreen() {
    const app = document.getElementById('app-container');
    if (window.innerWidth <= 600) { app.style.transform = ''; return; }
    const s = Math.min(1, (window.innerHeight - 12) / app.offsetHeight, (window.innerWidth - 12) / app.offsetWidth);
    app.style.transform = s < 1 ? `scale(${s})` : '';
}

    '#test-bar{display:none;align-items:center;gap:8px;background:rgba(255,255,255,.94);border:2px solid #7fd3c6;border-radius:20px;',
    '  padding:3px 5px 3px 12px;font-family:"Yusei Magic",sans-serif;color:#138577;white-space:nowrap;font-size:clamp(12px,1.5vw,16px);}',
    '#test-dots{letter-spacing:1px;}',
    '#test-stop{font-family:"Yusei Magic",sans-serif;font-size:.9em;padding:3px 10px;border-radius:14px;border:2px solid #d8ccae;background:#fff;color:#6a7d96;cursor:pointer;}',
    'body.testing #test-btn{display:none;}',
    'body.testing #test-bar{display:flex;}',
    'body.testing #chal-mount{display:none;}',
    P.tabs.split(',').map(s => 'body.testing ' + s.trim()).join(',') + '{pointer-events:none;opacity:.45;}',
    '#test-result{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center;}',
    '#test-result.show{display:flex;}',
    '#test-result .tr-card{background:#fff;border-radius:20px;padding:22px 26px;box-shadow:0 10px 40px rgba(0,0,0,.3);max-width:94vw;max-height:92vh;overflow:auto;',
    '  font-family:"Yusei Magic",sans-serif;color:#34465f;}',
    '#test-result .tr-title{font-size:clamp(20px,3vw,28px);color:#138577;text-align:center;margin-bottom:12px;}',
    '#test-result table{border-collapse:collapse;font-size:clamp(14px,2vw,19px);margin:0 auto;}',
    '#test-result td{padding:6px 10px;border-bottom:2px dashed #eadfc6;white-space:nowrap;}',
    '#test-result td.no{color:#6a7d96;}',
    '#test-result td.r-ok{color:#2bb673;}',
    '#test-result td.r-ng{color:#e85d3b;}',
    '#test-result td.r-sk{color:#9aa6b5;}',
    '#test-result .tr-sum{text-align:center;margin-top:12px;font-size:clamp(16px,2.4vw,22px);}',
    '#test-result .tr-sum b{color:#e85d3b;font-size:1.3em;}',
    '#test-result .tr-btns{display:flex;gap:12px;justify-content:center;margin-top:16px;}',
    '#test-result button{font-family:"Yusei Magic",sans-serif;font-size:18px;padding:11px 20px;border-radius:14px;cursor:pointer;}',
    '#test-again{color:#fff;background:#1fae9c;border:none;box-shadow:0 3px 0 #138577;}',
    '#test-close{color:#6a7d96;background:#fff;border:2px solid #d8ccae;}'
  ].join('\n');
  document.head.appendChild(css);

  /* ---- ボタン・メニュー・帯（10問チャレンジの となり）---- */
  const mount = document.createElement('div');
  mount.id = 'test-mount';
  mount.innerHTML =
      '<button id="test-btn" type="button">' + (S.button || '📝 テストの 練習') + '</button>'
    + '<div id="test-menu">'
    +   TESTS.map((t,k) => '<button type="button" data-k="'+k+'">'+t.title+'<small>'+t.items.length+'問</small></button>').join('')
    + '</div>'
    + '<div id="test-bar"><span id="test-no"></span><span id="test-dots"></span>'
    +   '<button id="test-stop" type="button">やめる</button></div>';
  const anchor = q(P.after);
  const header = document.querySelector('header');
  if(anchor && anchor.parentNode) anchor.parentNode.insertBefore(mount, anchor.nextSibling);
  else if(header) header.appendChild(mount);
  else document.body.insertBefore(mount, document.body.firstChild);
  const res = document.createElement('div');
  res.id = 'test-result';
  document.body.appendChild(res);

  /* テストが 1つだけなら、メニューを 出さずに すぐ 始める */
  $('test-btn').addEventListener('click', e => {
    e.stopPropagation();
    if(TESTS.length === 1){ start(0); return; }
    const m = $('test-menu');
    m.classList.toggle('open');
    if(m.classList.contains('open')) placeMenu();
  });
  /* せまい 画面で メニューが 左に はみ出す ときは、画面の 中へ ずらす */
  function placeMenu(){
    const m = $('test-menu');
    m.style.left = ''; m.style.right = '';
    const r = m.getBoundingClientRect(), mr = mount.getBoundingClientRect();
    if(r.left < 8){ m.style.right = 'auto'; m.style.left = (8 - mr.left) + 'px'; }
  }
  $('test-menu').addEventListener('click', e => {
    const b = e.target.closest('button[data-k]'); if(!b) return;
    $('test-menu').classList.remove('open');
    start(+b.dataset.k);
  });
  document.addEventListener('click', e => {
    if(!e.target.closest('#test-mount')) $('test-menu').classList.remove('open');
  });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape') $('test-menu').classList.remove('open');
  });
  $('test-stop').addEventListener('click', () => stop());
  /* テストの あいだの「つぎの もんだい」は、その 大問を とばして つぎの 大問へ */
  document.addEventListener('click', e => {
    if(!run || !P.next || !e.target.closest(P.next)) return;
    e.stopPropagation(); e.preventDefault();
    skip();
  }, true);
  /* ヒントを 見たか（ボタンを おした あと hintOn が true なら）*/
  const hb = q(P.hint);
  if(hb) hb.addEventListener('click', () => setTimeout(() => {
    const r = cur();
    const on = (typeof hintOn === 'boolean') ? hintOn : true;
    if(r && on && r.st === 'todo') r.hint = true;
  }, 0));

  /* ---- 土台の 2つの 関数を つつむ（土台に もう 2行 入っていれば つつまない）---- */
  const BUILTIN = /TestRun/.test(String(showHanamaru)) || /TestRun/.test(String(applyJudge));
  if(!BUILTIN){
    const _show = showHanamaru;
    showHanamaru = function(){
      if(!run) return _show.apply(this, arguments);
      /* はなまるは ふつうに 出す。同じ モードの つぎの 問題へは 行かせない（noAutoNext を 一時的に）*/
      const m = (typeof M === 'object' && M) ? M : null;
      const had = m && Object.prototype.hasOwnProperty.call(m, 'noAutoNext');
      const old = m ? m.noAutoNext : undefined;
      try{ if(m) m.noAutoNext = true; }catch(e){}
      try{ _show.apply(this, arguments); }
      finally{ try{ if(m){ if(had) m.noAutoNext = old; else delete m.noAutoNext; } }catch(e){} }
      api.onDone();
    };
    const _judge = applyJudge;
    applyJudge = function(r){
      if(run && r && !r.ok && !r.skip) api.miss();
      return _judge.apply(this, arguments);
    };
  }

  /* ---- 中身 ---- */
  function cur(){ return run ? run.rec[run.i] : null; }
  function clearMine(){ clearTimeout(myTimer); myTimer = 0; }
  function bar(){
    if(!run) return;
    const T = TESTS[run.t], it = T.items[run.i];
    $('test-no').textContent = '📝 ' + (/^\d+$/.test(it.no) ? it.no+'問め' : it.no) + '（' + (run.i+1) + '／' + T.items.length + '）';
    $('test-dots').textContent = run.rec.map((r,i) => r.st==='done' ? '●' : r.st==='skip' ? '－' : (i===run.i ? '◎' : '○')).join('');
  }
  /* set で かえる 値を、はじめに 1回だけ おぼえておく */
  function saveSets(t){
    const saved = {};
    TESTS[t].items.forEach(it => {
      const o = setOf(it), md = MODES[it.mode];
      Object.keys(o).forEach(k => {
        const key = it.mode + '\u0000' + k;
        if(!(key in saved)) saved[key] = { md:md, k:k, had:Object.prototype.hasOwnProperty.call(md,k), v:md[k] };
      });
    });
    return saved;
  }
  function restoreSets(saved){
    Object.keys(saved || {}).forEach(key => {
      const s = saved[key];
      try{ if(s.had) s.md[s.k] = s.v; else delete s.md[s.k]; }catch(e){}
    });
  }
  function go(i){
    clearMine();
    run.i = i;
    const it = TESTS[run.t].items[i];
    const o = setOf(it);
    Object.keys(o).forEach(k => { try{ MODES[it.mode][k] = o[k]; }catch(e){} });
    setMode(it.mode);
    bar();
  }
  function start(t){
    const cb = q(P.chalBtn);
    if(window.Challenge10 && Challenge10.isOn && Challenge10.isOn() && cb) cb.click();
    res.classList.remove('show');
    let back = nowMode();
    if(run){ back = run.back; restoreSets(run.saved); }
    run = { t:t, i:0, rec:TESTS[t].items.map(() => ({ miss:0, hint:false, st:'todo' })), back:back, saved:saveSets(t) };
    document.body.classList.add('testing');
    go(0);
  }
  function next(){
    if(!run) return;
    if(run.i + 1 < run.rec.length) go(run.i + 1);
    else finish();
  }
  function skip(){
    const r = cur(); if(!r) return;
    if(r.st !== 'done') r.st = 'skip';
    clearMine();
    if(typeof clearAutoNext === 'function') clearAutoNext();
    next();
  }
  function finish(){
    clearMine();
    const T = TESTS[run.t];
    let perfect = 0;
    const rows = T.items.map((it,i) => {
      const r = run.rec[i];
      let tx, c;
      if(r.st==='done' && r.miss===0){ tx = '⭕ ノーミス'; c = 'r-ok'; perfect++; }
      else if(r.st==='done'){ tx = 'まちがい '+r.miss+'回'; c = 'r-ng'; }
      else { tx = 'とばした'; c = 'r-sk'; }
      return '<tr><td class="no">'+it.no+'</td><td>'+itemName(it)+'</td><td class="'+c+'">'+tx+'</td><td>'+(r.hint ? '💡' : '')+'</td></tr>';
    }).join('');
    res.innerHTML = '<div class="tr-card">'
      + '<div class="tr-title">📝 '+T.title+'　おわり！</div>'
      + '<table>'+rows+'</table>'
      + '<div class="tr-sum">ノーミスで できた 問題　<b>'+perfect+'</b> ／ '+T.items.length+'</div>'
      + '<div class="tr-btns"><button id="test-again" type="button">もう一度</button><button id="test-close" type="button">とじる</button></div>'
      + '</div>';
    res.classList.add('show');
    $('test-again').onclick = () => start(run.t);
    $('test-close').onclick = () => stop();
    $('test-again').focus();
  }
  /* やめる／とじる：set で かえた 値を もどして、はじめの タブへ */
  function stop(){
    if(!run) return;
    const back = run.back, saved = run.saved;
    run = null;
    clearMine();
    res.classList.remove('show');
    document.body.classList.remove('testing');
    restoreSets(saved);
    setMode(back && MODES[back] ? back : TESTS[0].items[0].mode);
  }

  const api = {
    on: () => !!run,
    /* showHanamaru から：その 大問は おわり。はなまるの あと つぎの 大問へ */
    onDone(){
      if(!run || res.classList.contains('show')) return !!run;
      const r = cur(); r.st = 'done';
      bar();
      clearMine();
      const go2 = () => { if(typeof autoTimers !== 'undefined') autoTimers = []; next(); };
      if(typeof autoTimers !== 'undefined' && Array.isArray(autoTimers)) autoTimers.push(setTimeout(go2, waitMs()));
      else myTimer = setTimeout(go2, waitMs());
      return true;
    },
    /* applyJudge から：まちがい（skip で ない もの）*/
    miss(){ const r = cur(); if(r && r.st === 'todo') r.miss++; },
    /* 外から つかう とき用 */
    start: t => start(t || 0),
    stop:  () => stop(),
    record: () => run ? JSON.parse(JSON.stringify(run.rec)) : null
  };
  return api;
})();
</script>
<!-- 📝 テストの 練習 ここまで -->
</body>
